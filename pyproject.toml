[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-risk-governance-lab"
version = "0.1.0"
description = "Inspectable, local AI deployment assessments for human review"
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.scripts]
ai-risk-lab = "ai_risk_lab.cli:main"

[tool.setuptools.packages.find]
include = ["ai_risk_lab*"]
